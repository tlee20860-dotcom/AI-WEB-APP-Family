# ============================================
# cleanup.yml — 一鍵清空專案程式碼（保留骨架）
# 用途：手動觸發，清空所有舊程式碼，為重構鋪路
# ============================================

name: Cleanup Project

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: '請輸入 DELETE_ALL 以確認清空 (此操作不可逆)'
        required: true
        default: ''

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Safety Check
        run: |
          if [ "${{ github.event.inputs.confirm }}" != "DELETE_ALL" ]; then
            echo "❌ 確認碼錯誤，終止執行。請輸入 DELETE_ALL"
            exit 1
          fi
          echo "✅ 確認碼正確，準備執行清空。"

      - name: Cleanup Files
        run: |
          echo "🧹 開始清空專案程式碼..."
          
          # 使用 find 刪除所有檔案，排除白名單（.git, .github, meta.json, README.md）
          find . -mindepth 1 -maxdepth 1 \
            ! -name ".git" \
            ! -name ".github" \
            ! -name "meta.json" \
            ! -name "README.md" \
            -exec rm -rf {} +
            
          echo "✅ 清空完成，目前根目錄剩餘檔案："
          ls -la

      - name: Commit and Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          git add -A
          
          if git diff --cached --quiet; then
            echo "沒有變更，倉庫可能已經是空的。"
          else
            git commit -m "chore: cleanup all project files for rebuild"
            git push
            echo "✅ 清空結果已推送到倉庫。"
          fi

