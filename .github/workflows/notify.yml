# ============================================
# notify.yml — v2.Family 變更時通知 AI-training-files
# 位置：v2.Family/.github/workflows/notify.yml
# ============================================

name: Notify AI-training-files

on:
  push:
    branches: [main, master]
    paths:
      - 'js/**'
      - 'functions/**'
      - '*.html'
      - '*.js'
      - '*.json'
      - 'css/**'

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger AI-training-files build
        run: |
          curl -X POST \
            -H "Accept: application/vnd.github.v3+json" \
            -H "Authorization: token ${{ secrets.CROSS_REPO_PAT }}" \
            https://api.github.com/repos/tlee20860-dotcom/AI-training-files/dispatches \
            -d '{"event_type":"v2-family-updated"}'
          echo "已通知 AI-training-files 重新建置"
