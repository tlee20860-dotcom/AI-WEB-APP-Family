<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FAMILY.FIN | 智能機械系統</title>
  <link rel="manifest" href="./manifest-app.json">
  <meta name="theme-color" content="#0B0F19">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="stylesheet" href="./app.css">
</head>
<body>
  <!-- 1. 登入視圖 -->
  <div id="auth-view" class="auth-page" style="display:none; align-items:center; justify-content:center; min-height:100vh; flex-direction:column; z-index:10;">
    <div class="mecha-panel" style="width:100%; max-width:400px;">
      <div class="mecha-content" style="padding:32px;">
        <h1 style="font-family:var(--font-mono); color:var(--primary); text-align:center; margin-bottom:8px; font-size:24px;">[ FAMILY.FIN ]</h1>
        <p class="text-muted" style="text-align:center; font-size:12px; margin-bottom:24px;">SYSTEM V2.0 // 智能機械終端</p>
        
        <form id="login-form">
          <div class="field">
            <label class="field-label">帳號 (ACCOUNT)</label>
            <input class="input" type="text" id="account" required autocomplete="username">
          </div>
          <div class="field">
            <label class="field-label">密碼 (PASSWORD)</label>
            <input class="input" type="password" id="password" required autocomplete="current-password">
          </div>
          <div id="login-error" class="badge badge-pending" style="display:none; width:100%; margin-bottom:16px; padding:8px;"></div>
          <button class="btn btn-primary" type="submit" style="width:100%; justify-content:center;">執行登入</button>
        </form>
      </div>
    </div>
  </div>

  <!-- 2. 載入視圖 -->
  <div id="loading-view" class="auth-page" style="display:none; align-items:center; justify-content:center; min-height:100vh; z-index:10;">
    <div class="mecha-panel">
      <div class="mecha-content" style="padding:40px; text-align:center;">
        <h1 style="font-family:var(--font-mono); color:var(--primary); margin-bottom:16px;">[ FAMILY.FIN ]</h1>
        <div class="mono text-cyan" id="loading-message">正在連接系統核心...</div>
      </div>
    </div>
  </div>

  <!-- 3. 主程式視圖 -->
  <div id="app-view" class="app-shell" style="display:none;">
    <aside class="sidebar">
      <div id="sidebar-root"></div>
    </aside>
    <div class="main-area">
      <header class="navbar" id="navbar-root"></header>
      <main class="content" id="page-content"></main>
    </div>
  </div>

  <!-- 4. 錯誤視圖 -->
  <div id="error-view" class="auth-page" style="display:none; align-items:center; justify-content:center; min-height:100vh; z-index:10;">
    <div class="mecha-panel" style="max-width:400px;">
      <div class="mecha-content" style="text-align:center; padding:32px;">
        <h1 style="color:#EF4444; font-size:40px; margin-bottom:16px;">⚠️</h1>
        <p class="mono text-red" style="margin-bottom:16px;">SYSTEM ERROR</p>
        <div id="error-message" class="mono" style="font-size:12px; margin-bottom:24px; color:var(--text-muted);"></div>
        <button class="btn btn-primary" onclick="location.reload()" style="width:100%; justify-content:center;">重新啟動</button>
      </div>
    </div>
  </div>

  <!-- 引入核心邏輯 (此檔會自動啟動 FSM) -->
  <script type="module" src="./js/app-core.js"></script>
  
  <!-- 引入圖標庫 -->
  <script src="https://unpkg.com/lucide@0.462.0/dist/umd/lucide.min.js"></script>
</body>
</html>
